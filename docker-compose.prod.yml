services:
  api:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    container_name: cherryops-api
    restart: unless-stopped
    env_file: .env
    user: "1001:1001"  # match VPS host sam (UID 1001:GID 1001)
    volumes:
      - cherryops_data:/app/data
    networks:
      - infra-net
    expose:
      - "3100"

  web-assets:
    build:
      context: web
      dockerfile: Dockerfile.prod
    profiles: [tools]
    volumes:
      - cherryops_web:/target
    command: ["sh", "-c", "rm -rf /target/* 2>/dev/null; cp -r /assets/* /target/"]

volumes:
  cherryops_data:
    external: true
    name: cherryops_data
  cherryops_web:
    external: true
    name: cherryops_web

networks:
  infra-net:
    external: true
    name: infra-net
