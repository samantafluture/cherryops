server {
    listen 80;
    server_name cherryops.samantafluture.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cherryops.samantafluture.com;

    ssl_certificate     /etc/letsencrypt/live/cherryops.samantafluture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cherryops.samantafluture.com/privkey.pem;

    root /usr/share/nginx/cherryops;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://cherryops-api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout for long-running task execution
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA — serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
